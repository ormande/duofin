<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#0A0F1D" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <!-- Blue Node Ribbon Gradient -->
    <linearGradient id="blueRibbon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="40%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>

    <!-- Pink/Coral Node Ribbon Gradient -->
    <linearGradient id="pinkRibbon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FB7185" />
      <stop offset="50%" stop-color="#EC4899" />
      <stop offset="100%" stop-color="#D946EF" />
    </linearGradient>

    <!-- Overlap Blend Glow -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- App Icon Squircle Base -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />

  <!-- Subtle Specular Inner Rim -->
  <rect width="508" height="508" x="2" y="2" rx="126" fill="none" stroke="rgba(255,255,255,0.14)" stroke-width="3" />

  <!-- Ambient Light Reflection Behind Nodes -->
  <circle cx="210" cy="240" r="120" fill="#2563EB" opacity="0.25" filter="url(#softGlow)" />
  <circle cx="310" cy="270" r="120" fill="#EC4899" opacity="0.25" filter="url(#softGlow)" />

  <!-- Interlocking Duo Infinity Loop (Partner 1 & Partner 2 Financial Harmony) -->
  <g filter="url(#softGlow)">
    <!-- Blue Loop (Left / Partner 1) -->
    <path 
      d="M 220,165 
         C 145,165 95,215 95,280 
         C 95,345 155,385 220,385 
         C 285,385 320,320 370,250 
         C 400,208 435,185 470,215" 
      fill="none" 
      stroke="url(#blueRibbon)" 
      stroke-width="44" 
      stroke-linecap="round" 
    />

    <!-- Pink Loop (Right / Partner 2 Interlocking Heart & Growth) -->
    <path 
      d="M 292,347 
         C 367,347 417,297 417,232 
         C 417,167 357,127 292,127 
         C 227,127 192,192 142,262 
         C 112,304 77,327 42,297" 
      fill="none" 
      stroke="url(#pinkRibbon)" 
      stroke-width="44" 
      stroke-linecap="round" 
    />

    <!-- Center Convergence Shimmer Node -->
    <circle cx="256" cy="256" r="18" fill="#FFFFFF" opacity="0.95" />
    <circle cx="256" cy="256" r="28" fill="none" stroke="#FFFFFF" stroke-width="4" opacity="0.4" />
  </g>
</svg>
